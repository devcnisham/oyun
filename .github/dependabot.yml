version: 2
updates:
  # npm packages: one weekly pull request for small updates, separate ones for majors
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # Majors that break the lint or type-check toolchain today; remove an entry when its tools catch up:
    # typescript-eslint rejects TypeScript 7, and eslint-plugin-react (via eslint-config-next) rejects ESLint 10.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # GitHub Actions are pinned by commit SHA in .github/workflows; this keeps those SHAs current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels: [dependencies]
