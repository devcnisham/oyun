<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OYUN – Play more in Mangaluru</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#14162b;--mu:#6b6f8a;--br:#4338ca;--br2:#e0e2ff;--ok:#16a34a;--okb:#dcfce7;--wa:#ea580c;--wab:#ffedd5;--ln:#e5e7f0;--ink:#14162b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1020;--card:#181b33;--tx:#eef0ff;--mu:#9a9fc4;--br:#818cf8;--br2:#262a55;--okb:#12351f;--wab:#3a2312;--ln:#2a2e52;--ink:#4338ca}}
:root[data-theme=dark]{--bg:#0e1020;--card:#181b33;--tx:#eef0ff;--mu:#9a9fc4;--br:#818cf8;--br2:#262a55;--okb:#12351f;--wab:#3a2312;--ln:#2a2e52;--ink:#4338ca}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}input,select,textarea{font:inherit;color:var(--tx)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--ln)}
.top>div{max-width:1280px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 16px}
.logo{font-weight:800;font-size:22px;letter-spacing:.14em;color:var(--br)}.logo i{font-style:normal;color:var(--ok)}
.nav{display:none;gap:4px;margin-left:24px}.nav button{padding:8px 14px;border-radius:99px;font-weight:700;color:var(--mu)}.nav button.on{background:var(--br2);color:var(--br)}
.sp{flex:1}.ib{width:40px;height:40px;border-radius:50%;background:var(--bg);position:relative;font-size:18px}.bd{position:absolute;top:-2px;right:-2px;background:var(--wa);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px}
.loc{font-weight:700;font-size:13px;color:var(--mu)}.av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:grid;place-items:center}
.bn{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mu);padding:4px}.bn button b{font-size:20px}.bn button.on{color:var(--br)}
main{max-width:1280px;margin:auto;padding:16px 16px 100px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}h2{font-size:18px;font-weight:800;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}h2 a{font-size:13px;color:var(--br);cursor:pointer}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:10px;align-items:center}.wr{flex-wrap:wrap}
.search{width:100%;margin-top:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--ln);background:var(--card);text-align:left;color:var(--mu);font-weight:600}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 16px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-weight:700;white-space:nowrap}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sc{flex:none;width:92px;padding:14px 6px;border-radius:16px;background:var(--card);text-align:center;font-weight:700;font-size:13px;border:1px solid var(--ln)}.sc b{display:block;font-size:28px;margin-bottom:4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border-radius:18px;border:1px solid var(--ln);overflow:hidden;box-shadow:0 2px 10px rgba(30,30,80,.05)}.pad{padding:14px}
.img{height:120px;display:grid;place-items:center;font-size:52px;position:relative}.hear{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);font-size:16px}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--br2);color:var(--br)}.tag.g{background:var(--okb);color:var(--ok)}.tag.o{background:var(--wab);color:var(--wa)}
.btn{padding:11px 18px;border-radius:13px;background:var(--ink);color:#fff;font-weight:800}.btn.s{background:var(--br2);color:var(--br)}.btn.w{width:100%}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.r{background:var(--wab);color:var(--wa)}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:18px;margin-top:16px}.hero .mu{color:#c7caff}.hero .btn{background:#fff;color:#14162b}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(min-width:700px){.slots{grid-template-columns:repeat(6,1fr)}}
.slot{padding:10px 4px;border-radius:12px;border:1.5px solid var(--ok);background:var(--card);text-align:center;font-weight:800;font-size:13px}.slot small{display:block;font-weight:600;color:var(--ok);font-size:11px;margin-top:2px}
.slot.few{border-color:var(--wa)}.slot.few small{color:var(--wa)}.slot.bk{border-color:var(--ln);background:var(--bg);color:var(--mu)}.slot.bk small{color:var(--mu)}.slot.sel{background:var(--ink);border-color:var(--ink);color:#fff}.slot.sel small{color:#c7caff}
.sk{background:linear-gradient(90deg,var(--ln),var(--bg),var(--ln));background-size:200%;animation:sh 1s infinite;border-radius:12px;height:50px}@keyframes sh{to{background-position:-200%}}
.dt{flex:none;width:58px;padding:10px 0;border-radius:14px;background:var(--card);border:1px solid var(--ln);text-align:center;font-weight:800}.dt small{display:block;font-weight:600;color:var(--mu)}.dt.on{background:var(--ink);color:#fff}.dt.on small{color:#c7caff}
.lock{background:var(--wab);color:var(--wa);padding:8px 12px;border-radius:12px;font-weight:800;display:flex;justify-content:space-between}
.sum{position:sticky;bottom:80px;margin-top:16px}@media(min-width:900px){.sum{bottom:16px}.cols{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}.sum{top:80px;bottom:auto}.nav{display:flex}.bn{display:none}main{padding-bottom:40px}}
.ln{display:flex;justify-content:space-between;padding:5px 0}.tot{border-top:1px dashed var(--ln);margin-top:6px;padding-top:10px;font-weight:800;font-size:17px}
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--ln);margin:14px 0}.tabs button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:var(--mu)}.tabs button.on{background:var(--br2);color:var(--br)}
.map{height:210px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(115deg,transparent 48%,#9ec5ff 49% 53%,transparent 54%),repeating-linear-gradient(0deg,#e6ecdc 0 38px,#dfe6d3 38px 40px),repeating-linear-gradient(90deg,transparent 0 58px,rgba(255,255,255,.7) 58px 61px);border:1px solid var(--ln)}
.pin{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;border-radius:99px;padding:4px 9px;font-weight:800;font-size:12px;box-shadow:0 3px 8px rgba(0,0,0,.25)}.me{position:absolute;width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;left:48%;top:55%;box-shadow:0 0 0 8px rgba(37,99,235,.2)}
#md{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,10,30,.55);align-items:flex-end;justify-content:center}#md.o{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .25s}@media(min-width:700px){#md{align-items:center}.sheet{border-radius:24px}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);margin:6px 0 12px}label{font-size:12px;font-weight:700;color:var(--mu)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:14px;background:var(--bg);margin:10px 0}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;border:1.5px solid var(--ln);margin-bottom:8px;width:100%;font-weight:700;text-align:left}.opt.on{border-color:var(--br);background:var(--br2)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}#toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:up .25s}
.qr{display:block;margin:10px auto;width:170px;height:170px;background:#fff;padding:8px;border-radius:14px;border:1px solid var(--ln)}
.em{text-align:center;padding:40px 16px}.em b{font-size:40px;display:block}.stars button{font-size:30px;color:#cbd0e5}.stars button.on{color:#f59e0b}
.pb{height:6px;border-radius:9px;background:var(--ln);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:var(--ok)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header class="top"><div><div class="logo">OY<i>U</i>N</div><nav class="nav" id="nav"></nav><div class="sp"></div><span class="loc" id="locl">📍 Mangaluru, Karnataka</span><button class="ib" onclick="notifs()">🔔<span class="bd" id="nb"></span></button><button class="av" onclick="go('profile')">A</button></div></header>
<main id="app"></main><nav class="bn" id="bn"></nav><div id="md" onclick="if(event.target===this)cl()"></div><div id="toast"></div>
<script>
const SP={Football:'⚽',Cricket:'🏏',Badminton:'🏸',Tennis:'🎾',Basketball:'🏀',Volleyball:'🏐','Table Tennis':'🏓'};
const COL=['#4338ca','#0f766e','#b45309','#be185d','#1d4ed8','#15803d'];
const V=[{id:0,n:'City Sports Arena',d:1.8,r:4.7,s:['Football','Badminton','Cricket'],p:800,x:40,y:45},{id:1,n:'Mangaluru Sports Hub',d:2.6,r:4.5,s:['Badminton','Table Tennis','Tennis'],p:400,x:62,y:30},{id:2,n:'KMC Sports Complex',d:3.4,r:4.6,s:['Basketball','Volleyball','Badminton'],p:600,x:25,y:30},{id:3,n:'Bejai Sports Arena',d:3.9,r:4.3,s:['Football','Cricket'],p:1000,x:70,y:65},{id:4,n:'Kadri Football Arena',d:4.8,r:4.4,s:['Football'],p:900,x:20,y:70},{id:5,n:'Surathkal Sports Centre',d:11.2,r:4.2,s:['Badminton','Tennis','Volleyball'],p:300,x:85,y:20}];
const HRS=[6,7,8,9,10,11,12,17,18,19,20,21];
const PL=[['Rahul','Football','Intermediate',4.7,2.3],['Sneha','Badminton','Advanced',4.9,1.4],['Imran','Cricket','Beginner',4.2,3.1],['Priya','Volleyball','Intermediate',4.6,4.0],['Dev','Football','Any',4.5,2.9]];
let S={view:'home',sport:'Football',vid:0,di:0,court:1,hr:null,lock:0,load:false,favs:new Set([0]),taken:new Set(),alerts:[],tab:'Upcoming',gf:{sp:'All',sk:'All',q:''},gtab:'Games',nid:0,
games:[{id:1,sp:'Football',t:'Football · 5v5',v:0,w:'Today · 7:00 PM',j:6,n:10,sk:'Intermediate',p:120,court:2,by:'Rahul'},{id:2,sp:'Badminton',t:'Badminton Doubles',v:1,w:'Today · 8:00 PM',j:3,n:4,sk:'Beginner',p:100,court:1,by:'Sneha'},{id:3,sp:'Cricket',t:'Cricket · 8-a-side',v:3,w:'Tomorrow · 6:00 AM',j:11,n:16,sk:'Any',p:150,court:1,by:'Imran'},{id:4,sp:'Basketball',t:'Basketball 3v3',v:2,w:'Wed · 6:00 PM',j:2,n:6,sk:'Advanced',p:90,court:1,by:'Priya'},{id:5,sp:'Football',t:'Football · 7v7',v:4,w:'Thu · 7:00 PM',j:9,n:14,sk:'Any',p:130,court:1,by:'Dev'}],
joined:[],created:[],
bk:[{id:'OYUN-24891',v:0,sp:'Football',court:2,date:0,hr:19,tot:820,split:null,st:'Confirmed'}],
past:[{v:1,sp:'Badminton',w:'28 Sep',pl:4,rated:false},{v:0,sp:'Football',w:'21 Sep',pl:10,rated:true}],
nt:[['Booking confirmed','City Sports Arena · Today 7:00 PM'],['Your game starts in 2 hours','Football · Court 2'],['Rahul joined your football game','6/10 players now'],['Your saved venue has a slot available','City Sports Arena · Today 8 PM'],['2 spots are still available','Badminton Doubles']]};
const $=s=>document.querySelector(s),vn=i=>V[i].n,fm=n=>'₹'+n.toLocaleString('en-IN');
const hf=h=>(h%12||12)+':00 '+(h<12?'AM':'PM');
const D=i=>{const d=new Date(2026,9,5+i);return{d,dow:i?d.toLocaleDateString('en-IN',{weekday:'short'}):'Today',n:d.getDate(),full:d.toLocaleDateString('en-IN',{month:'long',day:'numeric'})}};
const dl=i=>i==0?'Today':i==1?'Tomorrow':D(i).dow;
function st(v,c,di,h){if(S.taken.has([v,c,di,h]+''))return'bk';const x=(v*7+c*3+di*5+h*11)%9;if(di==0&&h<17)return'bk';return x<2?'bk':x==2?'few':'ok'}
function price(v,h){return V[v].p+(h>=17?100:0)}
function toast(m){const e=document.createElement('div');e.textContent=m;$('#toast').append(e);setTimeout(()=>e.remove(),2200)}
function modal(h){$('#md').innerHTML='<div class="sheet">'+h+'</div>';$('#md').classList.add('o')}function cl(){$('#md').classList.remove('o')}
function qr(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;let s='<svg class="qr" viewBox="0 0 25 25" shape-rendering="crispEdges">';const f=(x,y)=>`<path d="M${x} ${y}h7v7h-7zM${x+1} ${y+1}v5h5v-5z" fill="#000" fill-rule="evenodd"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;s+=f(0,0)+f(18,0)+f(0,18);for(let y=0;y<25;y++)for(let x=0;x<25;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;h=(h*1103515245+12345)>>>0;if(h>>>16&1)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return s+'</svg>'}
const NAV=[['home','🏠','Home'],['book','🎟️','Book'],['games','🤝','Games'],['mine','📅','My Games'],['profile','👤','Profile']];
function go(v){S.view=v;cl();scrollTo(0,0);render()}
function shell(){const h=NAV.map(([k,i,t])=>`<button class="${S.view==k?'on':''}" onclick="go('${k}')">${window.innerWidth<900?'<b>'+i+'</b>':''}${t}</button>`).join('');$('#nav').innerHTML=h;$('#bn').innerHTML=h;const n=S.nt.length-S.nid;$('#nb').textContent=n>0?n:'';$('#nb').style.display=n>0?'':'none'}
function heart(i){return`<button class="hear" onclick="event.stopPropagation();fav(${i})">${S.favs.has(i)?'❤️':'🤍'}</button>`}
function fav(i){S.favs.has(i)?(S.favs.delete(i),toast('Removed from favorites')):(S.favs.add(i),toast('Added to favorites'));render()}
function vcard(v,btn='View Slots'){const o=V[v],a=HRS.filter(h=>st(v,1,0,h)!='bk').length;return`<div class="card"><div class="img" style="background:${COL[v]}">${SP[o.s[0]]}${heart(v)}</div><div class="pad"><div class="row" style="justify-content:space-between"><b>${o.n}</b><span>★ ${o.r}</span></div><div class="mu">${o.d} km away · ${o.s.slice(0,2).join(' · ')}</div><div class="row" style="justify-content:space-between;margin:10px 0"><span class="tag ${a>2?'g':'o'}">${a} slots available today</span><b>From ${fm(o.p-400>0?o.p:o.p)}/hr</b></div><button class="btn s w" onclick="pick(${v})">${btn}</button></div></div>`}
function pick(v){S.vid=v;if(!V[v].s.includes(S.sport))S.sport=V[v].s[0];S.hr=null;S.view='book';cl();render()}
function gcard(g){const l=g.n-g.j,o=V[g.v];return`<div class="card pad"><div class="row"><span style="font-size:30px">${SP[g.sp]}</span><div class="sp"><b>${g.t}</b><div class="mu">${o.n} · ${o.d} km</div></div><span class="tag ${l<=2?'o':'g'}">${l<=2?'Almost full':l+' spots left'}</span></div><div class="row wr" style="margin:10px 0"><b>${g.w}</b><span class="tag">${g.sk}</span></div><div class="pb"><i style="width:${g.j/g.n*100}%"></i></div><div class="row" style="justify-content:space-between"><span class="mu">${g.j} / ${g.n} players</span><b>${fm(g.p)} / player</b></div><div class="row" style="margin-top:12px"><button class="btn s sp" onclick="gd(${g.id})">Details</button><button class="btn sp" onclick="gd(${g.id})" ${S.joined.includes(g.id)?'disabled':''}>${S.joined.includes(g.id)?'Joined ✓':'Join Game'}</button></div></div>`}
function next(){const b=S.bk.find(b=>b.st!='Cancelled');return b?`<div class="hero"><div class="mu">Your next game</div><h1 style="margin:4px 0">${vn(b.v)}</h1><div>${dl(b.date)} · ${hf(b.hr)} · Court ${b.court}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="bkm('${b.id}')">View Booking</button><button class="btn" style="background:rgba(255,255,255,.18);color:#fff" onclick="bkm('${b.id}')">QR check-in</button></div></div>`:''}
function render(){shell();const f=({home,book,games,mine,profile})[S.view];$('#app').innerHTML=f();if(S.view=='book')tick()}
function home(){return`<div class="mu">Good evening, Affan 👋</div><h1>Where can you play today?</h1><button class="search" onclick="srch()">🔍 Search venues, sports or games...</button>${next()}<h2>Pick a sport</h2><div class="hs">${Object.keys(SP).map(s=>`<button class="sc" onclick="S.sport='${s}';S.vid=V.find(v=>v.s.includes('${s}')).id;S.hr=null;go('book')"><b>${SP[s]}</b>${s}</button>`).join('')}</div><h2>Near You <a onclick="go('book')">See all</a></h2><div class="grid">${V.slice(0,3).map(v=>vcard(v.id)).join('')}</div><h2>Games You Can Join <a onclick="go('games')">Find more</a></h2><div class="grid">${S.games.slice(0,3).map(gcard).join('')}</div><div class="row" style="margin-top:20px"><button class="btn w" onclick="cg()">+ Create a Game</button></div>`}
function book(){const v=V[S.vid],sps=Object.keys(SP),cs=S.sport=='Badminton'?4:2,cur=S.hr!=null,tot=cur?price(S.vid,S.hr):0;
const vs=V.filter(x=>x.s.includes(S.sport));
return`<h1>Book a slot</h1><div class="cols"><div><h2>1 · Sport</h2><div class="hs">${sps.map(s=>`<button class="chip ${s==S.sport?'on':''}" onclick="S.sport='${s}';S.vid=(V.find(x=>x.s.includes('${s}'))).id;S.hr=null;S.lock=0;render()">${SP[s]} ${s}</button>`).join('')}</div>
<h2>2 · Venue</h2><div class="hs">${vs.map(x=>`<button class="card pad" style="flex:none;width:200px;text-align:left;border:2px solid ${x.id==S.vid?'var(--br)':'var(--ln)'}" onclick="S.vid=${x.id};S.hr=null;S.lock=0;ld()"><b>${x.n}</b><div class="mu">${x.d} km · ★ ${x.r}</div><div class="mu">${fm(x.p)}/hr</div></button>`).join('')}</div>
<div class="row" style="margin-top:10px"><span class="mu sp">Facilities: Parking · Washroom · Changing Room · Water</span><button class="btn s" onclick="fav(${S.vid})">${S.favs.has(S.vid)?'❤️ Saved':'🤍 Save'}</button></div>
<h2>3 · Date <span class="mu">Next 7 days</span></h2><div class="hs">${[0,1,2,3,4,5,6].map(i=>`<button class="dt ${i==S.di?'on':''}" onclick="S.di=${i};S.hr=null;S.lock=0;ld()"><small>${D(i).dow}</small>${D(i).n}</button>`).join('')}</div>
<h2>4 · Court</h2><div class="hs">${Array.from({length:cs},(_,i)=>`<button class="chip ${S.court==i+1?'on':''}" onclick="S.court=${i+1};S.hr=null;S.lock=0;ld()">Court ${i+1}</button>`).join('')}</div>
<h2>5 · Time slot <span class="mu">tap to hold</span></h2>${S.load?'<div class="slots">'+'<div class="sk"></div>'.repeat(12)+'</div>':`<div class="slots">${HRS.map(h=>{const s=S.hr==h?'sel':st(S.vid,S.court,S.di,h);return`<button class="slot ${s=='sel'?'sel':s=='bk'?'bk':s=='few'?'few':''}" onclick="slot(${h},'${s}')">${hf(h)}<small>${s=='sel'?'Selected':s=='bk'?'Booked':s=='few'?'Few left':'Available'} ${s=='bk'?'':fm(price(S.vid,h))}</small></button>`}).join('')}</div>`}
<div class="row mu" style="margin-top:10px">🟢 Available · 🟠 Few left · ⬜ Booked · ⬛ Selected</div></div>
<div class="card pad sum">${cur?`<div class="lock"><span>🔒 Slot held for</span><span id="tm">10:00</span></div><h2 style="margin:12px 0 6px">Booking summary</h2><div class="ln"><span class="mu">Venue</span><b>${v.n}</b></div><div class="ln"><span class="mu">Sport · Court</span><b>${S.sport} · Court ${S.court}</b></div><div class="ln"><span class="mu">Date</span><b>${D(S.di).full}</b></div><div class="ln"><span class="mu">Time</span><b>${hf(S.hr)} – ${hf(S.hr+1)}</b></div><div class="ln"><span class="mu">Court fee</span><span>${fm(tot)}</span></div><div class="ln"><span class="mu">Platform fee</span><span>₹20</span></div><div class="ln tot"><span>Total</span><span>${fm(tot+20)}</span></div><button class="btn w" style="margin-top:12px" onclick="pay()">Continue to Payment</button>`:`<b>Choose a slot</b><div class="mu">Pick a sport, venue, date and court, then tap an available time. We'll hold it for 10 minutes while you pay.</div>`}</div></div>`}
function ld(){S.load=true;render();setTimeout(()=>{S.load=false;render()},450)}
let TI;function tick(){clearInterval(TI);TI=setInterval(()=>{if(!S.lock)return;const r=Math.max(0,Math.round((S.lock-Date.now())/1000)),e=$('#tm');if(e)e.textContent=String(r/60|0).padStart(2,'0')+':'+String(r%60).padStart(2,'0');if(!r&&S.hr!=null){S.hr=null;S.lock=0;toast('Hold expired – slot released');if(S.view=='book')render()}},500)}
function slot(h,s){if(s=='bk')return alertM(h);S.hr=h;S.lock=Date.now()+600000;toast('Slot selected');render();tick()}
function alertM(h){modal(`<h1>Slot taken</h1><p class="mu" style="margin:6px 0 14px">Get a nudge if ${vn(S.vid)} · Court ${S.court} frees up at ${hf(h)} on ${dl(S.di)}.</p><button class="btn w" onclick="mkAlert(${h})">🔔 Notify me when available</button>`)}
function mkAlert(h){cl();S.alerts.push(h);toast('Alert created');setTimeout(()=>{S.nt.unshift(['Slot available!',`${S.sport} Court ${S.court} at ${vn(S.vid)} is now available at ${hf(h)}.`]);shell();modal(`<h1>Slot available! 🔔</h1><p style="margin:8px 0 14px">${S.sport} Court ${S.court} at ${vn(S.vid)} is now available at ${hf(h)}.</p><button class="btn w" onclick="S.taken.delete([${S.vid},${S.court},${S.di},${h}]+'');S.hr=${h};S.lock=Date.now()+600000;cl();go('book')">Book Now</button>`)},4000)}
let PM='UPI',SPL=false,SN=8;
function pay(){const v=V[S.vid],c=price(S.vid,S.hr),t=c+20;modal(`<h1>Payment</h1><div class="mu">${v.n} · ${hf(S.hr)} · ${dl(S.di)}</div><div class="tg"><div><b>Split this payment</b><div class="mu">Share cost with players</div></div><input type="checkbox" ${SPL?'checked':''} style="width:22px;height:22px" onchange="SPL=this.checked;pay()"></div>${SPL?`<div class="ln"><span>Players</span><select class="in" style="width:90px;margin:0" onchange="SN=+this.value;pay()">${[2,4,6,8,10,12].map(n=>`<option ${n==SN?'selected':''}>${n}</option>`).join('')}</select></div><div class="ln"><span class="mu">Court fee ${fm(c)} ÷ ${SN}</span><b>${fm(Math.ceil(c/SN))} each</b></div>`:''}${['UPI','Credit / Debit Card','Wallet'].map(m=>`<button class="opt ${m==PM?'on':''}" onclick="PM='${m}';pay()">${m=='UPI'?'📲':m=='Wallet'?'👛':'💳'} ${m}</button>`).join('')}<div class="ln tot"><span>You pay now</span><span>${fm(SPL?Math.ceil(c/SN)+20:t)}</span></div><button class="btn w" style="margin-top:12px" onclick="confirmB()">Pay ${fm(SPL?Math.ceil(c/SN)+20:t)}</button>`)}
function confirmB(){const c=price(S.vid,S.hr),id='OYUN-'+(24892+S.bk.length),b={id,v:S.vid,sp:S.sport,court:S.court,date:S.di,hr:S.hr,tot:c+20,split:null,st:'Confirmed'};S.taken.add([S.vid,S.court,S.di,S.hr]+'');
if(SPL){const sh=Math.ceil(c/SN);b.split=Array.from({length:SN},(_,i)=>({n:i?'Player '+(i+1):'You',a:sh,s:i?'Pending':'Paid'}));b.st='Awaiting players';b.sh=sh;
b.split.forEach((p,i)=>{if(i)setTimeout(()=>{p.s=i==SN-1&&SN>3?'Failed':'Paid';if(b.split.every(x=>x.s=='Paid')){b.st='Confirmed';toast('Game confirmed 🎉')}if(p.s=='Failed')setTimeout(()=>{p.s='Paid';b.st='Confirmed';toast('Game confirmed 🎉');if(S.view=='mine')render()},2500);if(S.view=='mine')render()},i*1500)})}
S.bk.unshift(b);S.hr=null;S.lock=0;S.nt.unshift(['Booking confirmed',`${vn(b.v)} · ${hf(b.hr)}`]);toast('Payment completed');bkm(id);toast('Booking confirmed');S.tab='Upcoming';S.view='mine';render()}
function bkm(id){const b=S.bk.find(x=>x.id==id);modal(`<h1>Your Booking</h1>${qr(b.id)}<div style="text-align:center"><b>${b.id}</b><div class="mu">Show this QR code at the venue.</div></div><div class="ln"><span class="mu">Venue</span><b>${vn(b.v)}</b></div><div class="ln"><span class="mu">Court</span><b>${b.sp} · Court ${b.court}</b></div><div class="ln"><span class="mu">When</span><b>${dl(b.date)} · ${hf(b.hr)}</b></div><div class="ln"><span class="mu">Status</span><span class="tag ${b.st=='Confirmed'?'g':'o'}">${b.st}</span></div>${b.split?`<h2 style="font-size:15px">Payment split · ${fm(b.sh)} each</h2>${b.split.map(p=>`<div class="ln"><span>${p.n}</span><span class="tag ${p.s=='Paid'?'g':p.s=='Failed'?'o':''}">${p.s}</span></div>`).join('')}${b.split.every(p=>p.s=='Paid')?'<div class="tag g">Game confirmed 🎉</div>':'<div class="mu">Payment pending – deadline 2 hrs before start</div>'}`:''}${b.st!='Cancelled'?`<div class="row" style="margin-top:14px"><button class="btn r sp" onclick="canc('${id}')">Cancel</button><button class="btn s sp" onclick="resch('${id}')">Reschedule</button></div>`:''}`)}
function canc(id){modal(`<h1>Cancel booking?</h1><div class="card pad" style="margin:12px 0"><b>Cancellation policy</b><div class="ln"><span>Before 4 hours</span><b style="color:var(--ok)">100% refund</b></div><div class="ln"><span>Within 4 hours</span><b style="color:var(--wa)">50% refund</b></div></div><div class="row"><button class="btn s sp" onclick="cl()">Keep booking</button><button class="btn r sp" onclick="const b=S.bk.find(x=>x.id=='${id}');b.st='Cancelled';S.taken.delete([b.v,b.court,b.date,b.hr]+'');cl();toast('Booking cancelled · refund initiated');render()">Yes, cancel</button></div>`)}
let RD=0;function resch(id,sel){const b=S.bk.find(x=>x.id==id);modal(`<h1>Reschedule</h1><div class="hs" style="margin:12px 0">${[0,1,2,3,4,5,6].map(i=>`<button class="dt ${i==RD?'on':''}" onclick="RD=${i};resch('${id}')"><small>${D(i).dow}</small>${D(i).n}</button>`).join('')}</div><div class="slots">${HRS.map(h=>{const s=st(b.v,b.court,RD,h);return`<button class="slot ${s=='bk'?'bk':sel==h?'sel':''}" ${s=='bk'?'disabled':''} onclick="resch('${id}',${h})">${hf(h)}</button>`}).join('')}</div><button class="btn w" style="margin-top:14px" ${sel?'':'disabled'} onclick="const b=S.bk.find(x=>x.id=='${id}');b.date=RD;b.hr=${sel||0};cl();toast('Booking rescheduled');render()">Confirm new time</button>`)}
function games(){const g=S.gf,L=S.games.filter(x=>(g.sp=='All'||x.sp==g.sp)&&(g.sk=='All'||x.sk==g.sk)&&(x.t+vn(x.v)).toLowerCase().includes(g.q.toLowerCase()));
return`<div class="row"><h1 class="sp">${S.gtab=='Games'?'Find a Game':'Find Players'}</h1><button class="btn" onclick="cg()">+ Create</button></div><div class="tabs"><button class="${S.gtab=='Games'?'on':''}" onclick="S.gtab='Games';render()">Games</button><button class="${S.gtab=='Players'?'on':''}" onclick="S.gtab='Players';render()">Players</button></div>
${S.gtab=='Games'?`<div class="row"><input class="in" style="margin:0" placeholder="Search games or venues" value="${g.q}" oninput="S.gf.q=this.value;gl()" id="gq"><button class="btn s" onclick="toast('Using Mangaluru as your location')">📍</button></div><div class="hs" style="margin:10px 0">${['All',...Object.keys(SP)].map(s=>`<button class="chip ${g.sp==s?'on':''}" onclick="S.gf.sp='${s}';render()">${s}</button>`).join('')}</div><div class="hs">${['All','Beginner','Intermediate','Advanced','Any'].map(s=>`<button class="chip ${g.sk==s?'on':''}" onclick="S.gf.sk='${s}';render()">${s}</button>`).join('')}</div><h2>Games near Mangaluru</h2><div class="map"><div class="me"></div>${L.map(x=>`<button class="pin" style="left:${V[x.v].x}%;top:${V[x.v].y}%" onclick="gd(${x.id})">${SP[x.sp]} ${x.j}/${x.n}</button>`).join('')}</div><h2>Nearby games <span class="mu">${L.length}</span></h2><div class="grid" id="gl">${gl2(L)}</div>`:`<h2>Players nearby</h2><div class="grid">${PL.map(p=>`<div class="card pad row"><div class="av">${p[0][0]}</div><div class="sp"><b>${p[0]}</b><div class="mu">${p[1]} · ${p[2]}</div><div class="mu">★ ${p[3]} · ${p[4]} km away</div></div><button class="btn s" onclick="this.textContent='Invited ✓';toast('Invite sent to ${p[0]}')">Invite</button></div>`).join('')}</div><h2>Looking for players</h2><div class="grid">${S.games.filter(x=>x.n-x.j<=4).map(x=>`<div class="card pad row"><span style="font-size:28px">${SP[x.sp]}</span><div class="sp"><b>${x.sp} · ${x.w.split('· ')[1]||x.w}</b><div class="mu">Needs ${x.n-x.j} players</div></div><button class="btn" onclick="gd(${x.id})">Join</button></div>`).join('')}</div>`}`}
function gl2(L){return L.length?L.map(gcard).join(''):'<div class="em"><b>🔎</b>No games match.<div class="mu">Try another sport or create your own.</div></div>'}
function gl(){const g=S.gf;$('#gl').innerHTML=gl2(S.games.filter(x=>(g.sp=='All'||x.sp==g.sp)&&(g.sk=='All'||x.sk==g.sk)&&(x.t+vn(x.v)).toLowerCase().includes(g.q.toLowerCase())))}
function gd(id){const g=S.games.find(x=>x.id==id),l=g.n-g.j,me=g.by=='You',jd=S.joined.includes(id);
modal(`<span class="tag">${g.sp}</span><h1 style="margin:6px 0">${g.t}</h1><div class="ln"><span class="mu">Venue</span><b>${vn(g.v)}</b></div><div class="ln"><span class="mu">When</span><b>${g.w} · Court ${g.court}</b></div><div class="ln"><span class="mu">Skill</span><b>${g.sk}</b></div><div class="ln"><span class="mu">Players</span><b>${g.j} / ${g.n}</b></div><div class="ln"><span class="mu">Your share</span><b>${fm(g.p)}</b></div><h2 style="font-size:15px">Players</h2><div class="row wr">${[g.by,...['Aman','Neha','Zaid','Kiran','Sai'].slice(0,Math.min(3,g.j-1))].map((n,i)=>`<span class="tag">${i?'':'👑 '}${n}</span>`).join('')}${l?`<span class="tag o">+ ${l} spots available</span>`:''}${jd?'<span class="tag g">You</span>':''}</div>${me?`<div class="row" style="margin-top:14px"><button class="btn s sp" onclick="toast('Link copied')">Share</button><button class="btn s sp" onclick="toast('Invites sent')">Invite</button></div><button class="btn r w" style="margin-top:8px" onclick="S.games=S.games.filter(x=>x.id!=${id});S.created=S.created.filter(x=>x!=${id});cl();toast('Game cancelled');render()">Cancel game</button>`:`<button class="btn w" style="margin-top:14px" ${jd||!l?'disabled':''} onclick="joinG(${id})">${jd?'Joined ✓':'Join Game · '+fm(g.p)}</button>`}`)}
function joinG(id){const g=S.games.find(x=>x.id==id);modal(`<h1>Pay your share</h1><p class="mu">${g.t} · ${g.w}</p>${['UPI','Card','Wallet'].map((m,i)=>`<button class="opt ${i?'':'on'}" onclick="document.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));this.classList.add('on')">${m}</button>`).join('')}<button class="btn w" onclick="g=S.games.find(x=>x.id==${id});g.j++;S.joined.push(${id});toast('Payment completed');modal('<div class=em><b>🎉</b><h1>You\\'ve joined the game</h1><p class=mu>'+g.t+' · '+g.w+'</p></div><div class=row><button class=\\'btn s sp\\' onclick=toast(\\'Added\\\\u0020to\\\\u0020calendar\\')>Add to calendar</button><button class=\\'btn sp\\' onclick=go(\\'mine\\')>View game</button></div>');render()">Join Game · ${fm(g.p)}</button>`)}
function cg(){modal(`<h1>Create a Game</h1><label>Sport</label><select class="in" id="cs">${Object.keys(SP).map(s=>`<option>${s}</option>`)}</select><label>Venue</label><select class="in" id="cv">${V.map(v=>`<option value="${v.id}">${v.n} (${fm(v.p)}/hr)</option>`)}</select><div class="row"><div class="sp"><label>Date</label><select class="in" id="cd">${[0,1,2,3,4,5,6].map(i=>`<option value="${i}">${dl(i)}</option>`)}</select></div><div class="sp"><label>Time</label><select class="in" id="ct">${HRS.map(h=>`<option value="${h}" ${h==19?'selected':''}>${hf(h)}</option>`)}</select></div></div><div class="row"><div class="sp"><label>Players</label><select class="in" id="cn">${[2,4,6,8,10,12,14,16].map(n=>`<option ${n==10?'selected':''}>${n}</option>`)}</select></div><div class="sp"><label>Skill</label><select class="in" id="ck">${['Any','Beginner','Intermediate','Advanced'].map(s=>`<option>${s}</option>`)}</select></div></div><label>Description</label><textarea class="in" id="cx" rows="2">Looking for 4 more players for a casual game.</textarea><div class="tg"><span>Public game</span><input type="checkbox" checked style="width:22px;height:22px"></div><p class="mu" id="cp" style="margin-bottom:10px">Price per player is calculated automatically from the court fee.</p><button class="btn w" onclick="mkG()">Create Game</button>`)}
function mkG(){const sp=$('#cs').value,v=+$('#cv').value,h=+$('#ct').value,n=+$('#cn').value,d=+$('#cd').value,p=Math.ceil(price(v,h)/n),g={id:100+S.games.length,sp,t:sp+' · '+n/2+'v'+n/2,v,w:dl(d)+' · '+hf(h),j:1,n,sk:$('#ck').value,p,court:1,by:'You'};S.games.unshift(g);S.created.push(g.id);S.nt.unshift(['Game created',g.t]);toast('Game created');modal(`<div class="em"><b>🎉</b><h1>Game created successfully</h1><p class="mu">${g.t} · ${g.w}<br>Each player pays ${fm(p)} (court split ${n} ways)</p></div><div class="row"><button class="btn s sp" onclick="toast('Link copied')">Share</button><button class="btn s sp" onclick="go('games')">Invite players</button><button class="btn sp" onclick="gd(${g.id})">View</button></div>`);render()}
function mine(){const t=S.tab,ub=S.bk.filter(b=>b.st!='Cancelled'),jg=S.games.filter(g=>S.joined.includes(g.id));
let body;if(t=='Upcoming')body=ub.length||jg.length?`<div class="grid">${ub.map(b=>`<div class="card pad"><div class="row"><span style="font-size:30px">${SP[b.sp]}</span><div class="sp"><b>${b.sp}</b><div class="mu">${dl(b.date)} · ${hf(b.hr)}</div></div><span class="tag ${b.st=='Confirmed'?'g':'o'}">${b.st}</span></div><div style="margin:10px 0">${vn(b.v)} · Court ${b.court}</div><div class="row"><button class="btn s sp" onclick="bkm('${b.id}')">View Booking</button><button class="btn sp" onclick="bkm('${b.id}')">Get QR</button></div></div>`).join('')}${jg.map(gcard).join('')}</div>`:em('📅','No upcoming games','Find a game and get playing.','Find Games',"go('games')");
else if(t=='Past')body=`<div class="grid">${S.past.map((p,i)=>`<div class="card pad"><div class="row"><span style="font-size:30px">${SP[p.sp]}</span><div class="sp"><b>${p.sp} · Completed</b><div class="mu">${p.w} · ${vn(p.v)} · ${p.pl} players</div></div></div><button class="btn ${p.rated?'s':''} w" style="margin-top:10px" ${p.rated?'disabled':''} onclick="rev(${i})">${p.rated?'Reviewed ✓':'Rate Experience'}</button></div>`).join('')}</div>`;
else body=S.created.length?`<div class="grid">${S.games.filter(g=>S.created.includes(g.id)).map(g=>`<div class="card pad"><b>${g.t}</b><div class="mu">${g.w} · ${vn(g.v)}</div><div class="pb"><i style="width:${g.j/g.n*100}%"></i></div><div class="mu">${g.j} / ${g.n} players</div><div class="row" style="margin-top:10px"><button class="btn sp" onclick="gd(${g.id})">Manage</button><button class="btn s sp" onclick="toast('Invite link copied')">Invite</button></div></div>`).join('')}</div>`:em('🏟️','No games created','Host a game and split the court fee automatically.','Create a Game','cg()');
return`<h1>My Games</h1><div class="tabs">${['Upcoming','Past','Created'].map(x=>`<button class="${t==x?'on':''}" onclick="S.tab='${x}';render()">${x}</button>`).join('')}</div>${body}`}
function em(i,a,b,c,f){return`<div class="em"><b>${i}</b><h2 style="justify-content:center;margin:8px">${a}</h2><p class="mu" style="margin-bottom:14px">${b}</p><button class="btn" onclick="${f}">${c}</button></div>`}
function rev(i){let r=0;window.setR=n=>{r=n;document.querySelectorAll('.stars button').forEach((b,j)=>b.classList.toggle('on',j<n))};modal(`<h1>How was your game?</h1><p class="mu">${vn(S.past[i].v)}</p><div class="stars row" style="justify-content:center">${[1,2,3,4,5].map(n=>`<button onclick="setR(${n})">★</button>`).join('')}</div><textarea class="in" rows="3" placeholder="Tell us about your experience..."></textarea><label>Would you play here again?</label><div class="row" style="margin:8px 0 14px"><button class="chip" onclick="this.classList.toggle('on')">Yes</button><button class="chip" onclick="this.classList.toggle('on')">No</button></div><div class="row"><button class="btn s sp" onclick="cl()">Skip</button><button class="btn sp" onclick="S.past[${i}].rated=true;cl();toast('Review submitted');render()">Submit Review</button></div>`)}
function profile(){const f=[...S.favs];return`<div class="row"><div class="av" style="width:72px;height:72px;font-size:28px">A</div><div><h1>Affan</h1><div class="mu">📍 Mangaluru · Football, Badminton · Intermediate</div></div></div><div class="grid" style="grid-template-columns:repeat(2,1fr);margin-top:16px">${[['Games Played',24],['Hosted',S.created.length+6],['Joined',S.joined.length+18],['Rating','4.8 ★']].map(s=>`<div class="card pad"><div class="mu">${s[0]}</div><h1>${s[1]}</h1></div>`).join('')}</div><h2>Your Favorite Venues</h2>${f.length?`<div class="grid">${f.map(i=>vcard(i)).join('')}</div>`:em('🤍','No favorite venues yet.','Save venues to quickly find their next available slots.','Browse venues',"go('book')")}<h2>Account</h2><div class="card">${[['⭐','My Reviews'],['💳','Payment History'],['🔔','Notifications'],['⚙️','Settings']].map(([i,t])=>`<button class="ln pad" style="width:100%;border-bottom:1px solid var(--ln)" onclick="${t=='Notifications'?'notifs()':t=='Settings'?'sett()':`toast('${t}: ${t=='My Reviews'?'1 review':'3 payments · ₹1,240'}')`}"><span>${i} ${t}</span><span>›</span></button>`).join('')}</div>`}
function sett(){const d=document.documentElement;modal(`<h1>Settings</h1><div class="tg"><b>Dark mode</b><input type="checkbox" style="width:22px;height:22px" ${d.dataset.theme=='dark'?'checked':''} onchange="document.documentElement.dataset.theme=this.checked?'dark':'light'"></div>`)}
function notifs(){S.nid=S.nt.length;shell();modal(`<h1>Notifications</h1>${S.nt.map(n=>`<div class="ln" style="border-bottom:1px solid var(--ln)"><div><b>${n[0]}</b><div class="mu">${n[1]}</div></div></div>`).join('')}`)}
function srch(){modal(`<input class="in" id="sq" placeholder="Search venues, sports, games, players" oninput="sr(this.value)" autofocus><div id="sres" class="mu">Try “Football” or “Rahul”</div>`);setTimeout(()=>$('#sq').focus(),50)}
function sr(q){q=q.toLowerCase().trim();if(!q)return;const vs=V.filter(v=>(v.n+v.s).toLowerCase().includes(q)),gs=S.games.filter(g=>(g.t+vn(g.v)).toLowerCase().includes(q)),ps=PL.filter(p=>(p[0]+p[1]).toLowerCase().includes(q)),sp=Object.keys(SP).filter(s=>s.toLowerCase().includes(q));
$('#sres').innerHTML=(vs.length?'<h2 style="font-size:14px">Venues</h2>'+vs.map(v=>`<button class="opt" onclick="pick(${v.id})">${SP[v.s[0]]} ${v.n}<span class="mu sp" style="text-align:right">${v.d} km</span></button>`).join(''):'')+(gs.length?'<h2 style="font-size:14px">Games</h2>'+gs.map(g=>`<button class="opt" onclick="gd(${g.id})">${SP[g.sp]} ${g.t}<span class="mu sp" style="text-align:right">${g.w}</span></button>`).join(''):'')+(ps.length?'<h2 style="font-size:14px">Players</h2>'+ps.map(p=>`<button class="opt" onclick="S.gtab='Players';go('games')">👤 ${p[0]}<span class="mu sp" style="text-align:right">${p[1]}</span></button>`).join(''):'')+(sp.length?'<h2 style="font-size:14px">Sports</h2>'+sp.map(s=>`<button class="opt" onclick="S.sport='${s}';S.vid=V.find(v=>v.s.includes('${s}')).id;go('book')">${SP[s]} ${s}</button>`).join(''):'')||'No results'}
addEventListener('resize',shell);render();setTimeout(()=>{S.nt.unshift(['Rahul joined your football game','6/10 players now']);shell()},8000);
</script></body></html>
