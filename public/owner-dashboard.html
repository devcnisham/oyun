<style>

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.3px}h2{font-size:16px;margin:0;font-weight:700}h3{font-size:14px;margin:0}
.mut{color:var(--mut)}.sm{font-size:12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}

.seg button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g32{grid-template-columns:2fr 1fr}

.chart{position:relative;height:260px}
.sec{margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}

.tw{overflow-x:auto}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.b.ok{background:var(--okb);color:var(--ok)}.b.warn{background:var(--warnb);color:var(--warn)}.b.bad{background:var(--badb);color:var(--bad)}.b.info{background:var(--infob);color:var(--info)}.b.n{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:700;transition:.15s}.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{filter:brightness(1.08);color:#fff}.btn.d{color:var(--bad)}.btn.s{padding:4px 10px;font-size:12px}
.ins{border-left:4px solid var(--acc)}.ins.w{border-color:#f59e0b}.ins.i{border-color:#3b82f6}.ins p{margin:6px 0 12px;color:var(--mut)}
.pos{background:linear-gradient(135deg,#065f46,#0b1220);color:#fff;border:0}.pos .mut{color:#a7f3d0}
.cal{display:grid;gap:6px;min-width:620px}.slot{border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--line);text-align:center;transition:.15s;min-height:46px}
.slot:hover{transform:scale(1.03)}.s-a{background:var(--card);color:var(--mut);border-style:dashed}.s-b{background:var(--okb);color:var(--ok)}.s-x{background:var(--badb);color:var(--bad)}.s-m{background:var(--warnb);color:var(--warn)}
.lg span{margin-right:14px;font-size:12px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.ov.on{display:flex}
.md{background:var(--card);border-radius:18px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow:auto;animation:pop .2s}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 4px}input,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;z-index:90;transition:.3s;opacity:0}.toast.on{transform:translateX(-50%);opacity:1}
.big{font-size:30px;font-weight:800}.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.chk{text-align:center;padding:10px 0}.chk .ic{font-size:44px;color:var(--acc)}
.mb{display:none;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 12px;align-items:center;gap:10px}
.tip{background:var(--accs);color:var(--ok);padding:10px 14px;border-radius:12px;font-weight:700;margin-bottom:18px;font-size:13px}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g32,.g3{grid-template-columns:1fr}}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:14px 16px 60px}.mb{display:flex}.g2{grid-template-columns:1fr}h1{font-size:21px}}
@media(max-width:480px){.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}}
</style></head><body>

<script>

function qr(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;const r=()=>(h=(h*1664525+1013904223)>>>0)/4294967296,N=25;let s='';
const fin=(x,y)=>x<7&&y<7||x>N-8&&y<7||x<7&&y>N-8;

if(on)s+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
return '<svg viewBox="-1 -1 27 27" width="170" height="170" style="background:#fff;border-radius:10px;padding:4px" fill="#0f172a">'+s+'</svg>'}

V.venues=()=>`<div class="top"><div><h1>Venues & Pricing</h1><div class="mut">City Arena · Mangaluru, Karnataka</div></div><div><button class="btn" onclick="toast('Venue editor (prototype)')">Edit Venue</button> <button class="btn p" onclick="toast('Add court (prototype)')">+ Add Court</button></div></div>
<div class="grid g2"><div class="card"><h2>Courts</h2>${COURTS.map(c=>`<div class="row"><span>${c}</span>${bdg(c.startsWith('Foot')?'Football':c=='Box Cricket'?'Cricket':'Badminton','n')}</div>`).join('')}<h3 style="margin:16px 0 8px">Facilities</h3>${['Parking','Floodlights','Changing Room','Drinking Water','Washroom'].map(f=>bdg(f,'ok')+' ').join('')}<div class="acts"><button class="btn s" onclick="toast('Upload photos (prototype)')">Upload Photos</button><button class="btn s" onclick="toast('Facilities updated')">Update Facilities</button></div></div>
<div class="card"><h2>Pricing · Football Court 1</h2><div class="mut sm" style="margin-bottom:6px">Time-based, weekend, holiday and student pricing</div>${Object.keys(PR).map(k=>`<div class="row" style="align-items:center"><span>${k}</span><span><button class="btn s" onclick="pr('${k}',-50)">−</button> <b id="p-${k.replace(/ /g,'')}" style="margin:0 8px">${R(PR[k])}/hr</b> <button class="btn s" onclick="pr('${k}',50)">+</button></span></div>`).join('')}</div></div>
<div class="card pos sec"><div class="mut sm">✦ Smart Pricing</div><div class="grid g3" style="margin-top:8px"><div><div class="mut sm">Current price</div><div class="big" id="sp">${R(PR['Weekday Evening'])}/hr</div></div><div><div class="mut sm">OYUN recommended</div><div class="big">₹1,000/hr</div></div><div><div class="mut sm">Reason</div>Friday 7–9 PM has 96% occupancy and high demand.</div></div><div class="acts"><button class="btn p" onclick="applySmart()">Apply Recommendation</button></div></div>`;
V.customers=()=>`<div class="top"><div><h1>Customers</h1><div class="mut">Your best customers, and who needs a nudge</div></div></div><div class="card"><div class="tw"><table><tr><th>Customer</th><th>Bookings</th><th>Total spent</th><th>Last visit</th><th>Rating</th><th>Status</th></tr>${CU.map((c,i)=>`<tr class="r" onclick="cp(${i})"><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${R(c[2])}</td><td>${c[3]}</td><td>★ ${c[4]}</td><td>${bdg(c[5],c[5]=='VIP'?'ok':c[5]=='Regular'?'info':'warn')}</td></tr>`).join('')}</table></div></div>
<div class="grid g2 sec"><div class="card"><div class="mut sm">No-show rate</div><div class="big">4.2%</div><div class="mut sm">Non-punitive: flag customers to send a gentle reminder, not to block them.</div></div><div class="card"><h3>Rahul Shetty</h3><div class="mut sm">Bookings 14 · No-shows 3 · Rate 21%</div><div class="acts"><button class="btn s" onclick="toast('Rahul flagged for reminders')">Flag customer</button></div></div></div>`;
const RV={'7D':[['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],K.week.V],'30D':[Array.from({length:30},(_,i)=>i+1),Array.from({length:30},(_,i)=>5500+Math.round(2600*Math.sin(i/2.2+1)+1800*((i%7)>4)))],'3M':[['W1','W2','W3','W4','W5','W6','W7','W8','W9','W10','W11','W12'],[41,44,39,47,52,49,55,53,58,61,57,64].map(x=>x*1000)],'1Y':[['Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'],[96,104,112,118,131,142,150,158,171,189,214,184].map(x=>x*1000)]};
const st=v=>{const t=v.reduce((a,b)=>a+b,0);return [t,Math.round(t/v.length),Math.max(...v)]};
V.revenue=()=>{const [l,v]=RV[aRange],[t,a,m]=st(v);return `<div class="top"><div><h1>Revenue</h1><div class="mut">Earnings, payouts and settlements</div></div></div>
<div class="card"><div class="hd"><h2>Revenue Overview</h2>${segU(['7D','30D','3M','1Y'],aRange,'setA')}</div><div class="grid g3" style="margin-bottom:10px">${[['Total Revenue',R(t)],['Avg per period',R(a)],['Best period',l[v.indexOf(m)]+' · '+R(m)]].map(x=>'<div><div class="mut sm">'+x[0]+'</div><b style="font-size:20px">'+x[1]+'</b></div>').join('')}</div><div class="chart"><canvas id="c1"></canvas></div></div>
<div class="grid g2 sec"><div class="card"><h2>Revenue Breakdown</h2>${[['Gross Revenue','₹2,27,500'],['OYUN Commission','-₹22,750'],['Refunds','-₹4,500']].map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}<div class="row"><b>Net Earnings</b><b style="color:var(--ok);font-size:18px">₹2,00,250</b></div><h3 style="margin:16px 0 4px">Payment methods</h3>${[['UPI',120000],['Cards',52500],['Cash',27750]].map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+R(x[1])+'</b></div>').join('')}</div>
<div class="card"><h2>Next Settlement</h2><div class="big" style="margin:8px 0">₹24,850</div><div class="mut">Expected Friday, October 9</div><div class="tw" style="margin-top:14px"><table><tr><th>Date</th><th>Booking</th><th>Gross</th><th>Comm.</th><th>Net</th><th>Status</th></tr>${[['Oct 8','OY-82931',900,'Pending'],['Oct 8','OY-82934',1100,'Processing'],['Oct 7','OY-82911',1200,'Paid'],['Oct 7','OY-82902',900,'Paid']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${R(r[2])}</td><td>-${R(r[2]/10)}</td><td>${R(r[2]*.9)}</td><td>${bdg(r[3],r[3]=='Paid'?'ok':r[3]=='Pending'?'warn':'info')}</td></tr>`).join('')}</table></div></div></div>`};
const segU=(a,cur,fn)=>'<div class="seg">'+a.map(x=>'<button class="'+(x==cur?'on':'')+'" onclick="'+fn+"('"+x+"')\">"+x+'</button>').join('')+'</div>';
const AT={Revenue:[['Daily avg',R(32500)],['Weekly',R(227500)],['Monthly',R(184500)],['Growth','↑ 12.4%']],Bookings:[['Total',247],['Completed',221],['Cancelled',18],['No-shows',8]],Occupancy:[['Overall','82%'],['Football 1','91%'],['Box Cricket','78%'],['Badminton','64%']],'Peak Hours':[['Peak','6–9 PM'],['Avg occupancy','93%'],['Lowest','12–2 PM'],['Lowest avg','19%']],Sports:[['Football','52%'],['Badminton','21%'],['Cricket','18%'],['Other','9%']],Customers:[['New',58],['Returning','68%'],['Avg spend',R(992)],['Retention','58%']]};
V.analytics=()=>`<div class="top"><div><h1>Analytics</h1><div class="mut">Which courts earn most, when you're busiest, who your best customers are</div></div></div>
${segU(Object.keys(AT),tab,'setT')}<div class="grid g4 sec">${AT[tab].map(x=>kpi(x[0],x[1],'this month')).join('')}</div>
<div class="card sec"><div class="hd"><h2>${tab} · ${tab=='Peak Hours'||tab=='Occupancy'?'Hourly occupancy':tab=='Sports'?'Booking share':'Trend'}</h2></div><div class="chart"><canvas id="c1"></canvas></div></div>
<div class="card sec"><div class="hd"><div><h2>OYUN Monthly Report</h2><div class="mut sm">September 2026</div></div><div><button class="btn s" onclick="toast('Report downloaded (prototype)')">Download Report</button> <button class="btn s" onclick="toast('Share link copied (prototype)')">Share Report</button></div></div>
<div class="grid g4">${[['Revenue','₹2,14,500'],['Bookings',247],['Occupancy','82%'],['Customers',186],['Repeat Rate','68%'],['No-show Rate','4.2%'],['Best day','Saturday'],['Fastest growing','Badminton']].map(x=>'<div><div class="mut sm">'+x[0]+'</div><b style="font-size:18px">'+x[1]+'</b></div>').join('')}</div></div>`;
V.offers=()=>`<div class="top"><div><h1>Offers & Promotions</h1><div class="mut">Monetize unused inventory</div></div></div>
<div class="grid g2"><div class="card"><h2>Create offer</h2><label>Offer name</label><input id="on" value="Student Weekday Offer"><div class="grid g2"><div><label>Discount</label><input id="od" value="10%"></div><div><label>Days</label><input id="ody" value="Mon–Thu"></div><div><label>Time</label><input id="ot" value="1 PM – 5 PM"></div><div><label>Sport</label><select id="os"><option>Football</option><option>Cricket</option><option>Badminton</option></select></div></div><div class="acts"><button class="btn p" onclick="mkOffer()">Create Offer</button></div></div>
<div class="card"><h2>Active offers</h2><div id="ol">${OFF.map(o=>`<div class="row" style="align-items:center"><div><b>${o.n}</b><div class="mut sm">${o.w}</div></div><div style="text-align:right">${bdg(o.d,'ok')}<div class="sm">${o.bk} bookings · ${R(o.rev)}</div></div></div>`).join('')}</div></div></div>
<div class="sec"><div class="hd"><h2>Fill Empty Slots</h2><span class="mut sm">Low demand detected</span></div><div class="grid g3">${SL.map((s,i)=>`<div class="card h"><div class="mut sm">${s[0]}</div><h3 style="margin:4px 0">${s[1]}</h3><div><s class="mut">${R(s[2])}</s> <b style="font-size:20px;color:var(--acc)">${R(s[3])}</b> <span class="mut sm">flash offer</span></div><div class="acts"><button id="pb${i}" class="btn ${promoted[i]?'':'p'}" onclick="promo(${i})">${promoted[i]?'✓ Promoted':'Promote Slot'}</button></div></div>`).join('')}</div></div>`;
V.settings=()=>`<div class="top"><div><h1>Settings</h1></div></div><div class="grid g2"><div class="card"><h2>Owner Profile</h2>${[['Venue','City Arena'],['Location','Mangaluru, Karnataka'],['Owner','Mohammed'],['Phone','+91 XXXXX XXXXX'],['Email','owner@example.com'],['Status','● Live']].map(x=>'<div class="row"><span class="mut">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}</div>
<div class="card"><h2>Notifications</h2>${[['🔔 New booking','Football Court 1 booked by Affan.'],['💰 Payment received','₹900 received.'],['⚠️ Cancellation','Booking OY-82921 cancelled.'],['📈 Weekly milestone','Your revenue increased 18%.'],['🔥 Peak demand','Friday 7–9 PM is almost full.']].map(x=>'<div class="row"><b>'+x[0]+'</b><span class="mut sm">'+x[1]+'</span></div>').join('')}</div></div>`;
/* ---- charts per view ---- */
function charts(){CH.forEach(c=>c.destroy());CH=[];const a=col('--acc');
if(view=='overview'){const k=K[range];mk('c1',{type:range=='today'?'bar':'line',data:{labels:k.L,datasets:[{data:k.V,backgroundColor:a+'33',borderColor:a,borderWidth:2.5,fill:true,tension:.35,borderRadius:8,pointRadius:3}]}})}
if(view=='revenue'){const [l,v]=RV[aRange];mk('c1',{type:'line',data:{labels:l,datasets:[{data:v,borderColor:a,backgroundColor:a+'22',fill:true,tension:.35,borderWidth:2.5,pointRadius:2}]}})}
if(view=='analytics'){const bar=(l,d,pct)=>mk('c1',{type:'bar',pct,data:{labels:l,datasets:[{data:d,borderRadius:6,backgroundColor:d.map(x=>pct&&x>=90?a:pct?a+'66':a)}]}});
if(tab=='Peak Hours'||tab=='Occupancy')bar(PK.map(x=>x[0]),PK.map(x=>x[1]),true);
else if(tab=='Sports')mk('c1',{type:'doughnut',data:{labels:['Football','Badminton','Cricket','Other'],datasets:[{data:[52,21,18,9],backgroundColor:[a,'#3b82f6','#f59e0b','#94a3b8'],borderWidth:0}]}});
else if(tab=='Bookings')bar(K.week.L,[34,38,41,40,52,61,56]);
else if(tab=='Customers')bar(['W1','W2','W3','W4'],[12,15,14,17]);
else bar(K.week.L,K.week.V)}}
/* ---- actions ---- */
function go(v){view=v;sd.classList.remove('open');$('#nav').innerHTML=NAV.map(n=>`<a class="${n[0]==v?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</a>`).join('');$('#v').innerHTML=V[v]();charts();scrollTo(0,0)}
const setR=x=>{range=x;go(view)},setA=x=>{aRange=x;go(view)},setT=x=>{tab=x;go(view)};
const gb=id=>B.find(b=>b.id==id);
function bd(id){const b=gb(id);om(`<div class="hd"><h2>Booking #${b.id}</h2>${bdg(b.st,bc(b.st))}</div><div class="row"><span class="mut">Venue</span><b>City Arena · ${b.ct}</b></div><div class="row"><span class="mut">Date</span><b>October 8, 2026</b></div><div class="row"><span class="mut">Time</span><b>${b.t}</b></div><div class="row"><span class="mut">Customer</span><b>${b.c}</b></div><div class="row"><span class="mut">Phone</span><b>${b.ph}</b></div><div class="row"><span class="mut">Payment</span><b>${R(b.a)} · ${b.p.toUpperCase()}</b></div>
<div class="acts"><button class="btn" onclick="qm('${id}')">Generate QR</button>${b.st=='Confirmed'?`<button class="btn p" onclick="ci('${id}');cm()">Check In</button><button class="btn" onclick="toast('Reschedule sent (prototype)')">Reschedule</button><button class="btn d" onclick="cancel('${id}')">Cancel Booking</button>`:''}<button class="btn" onclick="toast('Contacting ${b.c.split(' ')[0]}…')">Contact Customer</button></div>`)}
function qm(id){const b=gb(id),used=!!b.ci;om(`<div style="text-align:center"><div class="mut sm" style="font-weight:800;letter-spacing:2px">OYUN BOOKING</div><div style="margin:12px 0;${used?'opacity:.25':''}">${qr(id)}</div>${used?bdg('QR used · invalid after check-in','bad'):''}<h3 style="margin-top:10px">City Arena · ${b.ct}</h3><div class="mut">October 8 · ${b.t}</div><div class="row" style="margin-top:10px"><span class="mut">Booking ID</span><b>${b.id}</b></div><div class="row"><span class="mut">Customer</span><b>${b.c.split(' ')[0]}</b></div><div style="margin-top:10px">${bdg(b.p.toUpperCase(),'ok')}</div></div><div class="acts"><button class="btn" onclick="cm()">Close</button></div>`)}
function ci(id){const b=gb(id);b.st='Checked In';b.ci='8:01 PM';toast('✓ '+b.c.split(' ')[0]+' checked in · 8:01 PM');go(view)}
function cancel(id){const b=gb(id);b.st='Cancelled';b.p='Refunded';cm();toast('Booking '+id+' cancelled');go(view)}
function scan(){om('<div class="chk"><div class="ic">⌗</div><h2>Scanning…</h2><div class="mut">Point camera at the customer QR</div></div>');setTimeout(()=>{const b=B.find(x=>x.st=='Confirmed');if(!b){om('<div class="chk"><div class="ic" style="color:var(--bad)">✕</div><h2>No valid bookings waiting</h2><div class="mut">Any scanned QR already checked-in is invalid.</div><div class="acts"><button class="btn" onclick="cm()">Close</button></div></div>');return}
om(`<div class="chk"><div class="ic">✓</div><h2 style="color:var(--ok)">VALID BOOKING</h2></div><div class="row"><span class="mut">Customer</span><b>${b.c.split(' ')[0]}</b></div><div class="row"><span class="mut">Court</span><b>${b.ct}</b></div><div class="row"><span class="mut">Time</span><b>${b.t}</b></div><div class="row"><span class="mut">Payment</span><b>${b.p.toUpperCase()}</b></div><div class="row"><span class="mut">Status</span><b>READY TO CHECK IN</b></div><div class="acts"><button class="btn p" style="flex:1" onclick="ci('${b.id}');done()">Confirm Check-in</button></div>`)},1100)}
function done(){om('<div class="chk"><div class="ic">✓</div><h2 style="color:var(--ok)">CHECKED IN</h2><div class="big">8:01 PM</div><div class="acts" style="justify-content:center"><button class="btn" onclick="cm()">Done</button> <button class="btn" onclick="scan()">Scan next</button></div></div>')}
function slot(c,h){const s=CAL[c][h],lab=c+' · '+hl(h);
if(s.s=='a')om(`<h2>${lab}</h2><div class="mut sm">Available slot</div><label>Customer name</label><input id="cn" placeholder="e.g. Vikram"><div class="acts"><button class="btn p" onclick="sc('${c}',${h},'b')">Create booking</button><button class="btn" onclick="sc('${c}',${h},'x')">Block slot</button><button class="btn" onclick="sc('${c}',${h},'m')">Mark maintenance</button><button class="btn" onclick="cm();go('venues')">Change pricing</button></div>`);
else if(s.s=='b')om(`<h2>${lab}</h2><div class="mut">Booked by <b>${s.w}</b></div><div class="acts"><button class="btn" onclick="toast('Edit booking (prototype)');cm()">Edit booking</button><button class="btn d" onclick="sc('${c}',${h},'a')">Cancel booking</button></div>`);
else om(`<h2>${lab}</h2><div class="mut">${s.s=='x'?'Blocked':'Under maintenance'}</div><div class="acts"><button class="btn p" onclick="sc('${c}',${h},'a')">Release slot</button></div>`)}
function sc(c,h,s){const n=($('#cn')||{}).value;CAL[c][h]=s=='b'?{s,w:n||'Walk-in'}:{s};cm();toast('Calendar updated');go('calendar')}
function pr(k,d){PR[k]+=d;$('#p-'+k.replace(/ /g,'')).textContent=R(PR[k])+'/hr';if(k=='Weekday Evening')$('#sp').textContent=R(PR[k])+'/hr'}
function applySmart(){PR['Weekday Evening']=1000;toast('Price updated to ₹1,000/hr for Friday 7–9 PM');if(view=='venues')go('venues')}
function mkOffer(){const n=$('#on').value||'New Offer';OFF.unshift({n,d:$('#od').value+' OFF',bk:0,rev:0,w:$('#ody').value+', '+$('#ot').value+' · '+$('#os').value});toast('Offer "'+n+'" is live');go('offers')}
function promo(i){promoted[i]=1;const b=$('#pb'+i);b.textContent='✓ Promoted';b.classList.remove('p');toast('Flash offer sent to nearby players')}
function cp(i){const c=CU[i];om(`<div class="hd"><h2>${c[0]}</h2>${bdg(c[5],c[5]=='VIP'?'ok':'info')}</div>${[['Total bookings',c[1]],['Total spent',R(c[2])],['Favorite sport',c[6]],['Favorite time',c[7]],['Cancellations',c[8]],['No-shows',c[9]],['Last visit',c[3]],['Loyalty','★ '+c[4]]].map(x=>'<div class="row"><span class="mut">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}<div class="acts"><button class="btn p" onclick="toast('Coupon sent');cm()">Send coupon</button></div>`)}
go('overview');
</script></body></html>
